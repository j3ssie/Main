name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\bin\test.ps1

  install-test:
    name: Vigolium install and autoupdate
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VIGOLIUM_DISABLE_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install, test autoupdate, and uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1 -OutFile "$env:RUNNER_TEMP/scoop-install.ps1"
          if ((Get-FileHash "$env:RUNNER_TEMP/scoop-install.ps1" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512') { throw 'Scoop installer checksum mismatch' }
          & "$env:RUNNER_TEMP/scoop-install.ps1" -RunAsAdmin
          $scoop = "$env:USERPROFILE/scoop/shims/scoop.ps1"
          $testBucket = "$env:RUNNER_TEMP/vigolium-test-bucket"
          New-Item "$testBucket/bucket" -ItemType Directory -Force | Out-Null
          Copy-Item bucket/vigolium.json "$testBucket/bucket/vigolium.json"
          $before = Get-Content "$testBucket/bucket/vigolium.json" -Raw | ConvertFrom-Json
          $checkver = "$env:USERPROFILE/scoop/apps/scoop/current/bin/checkver.ps1"
          & $checkver -App vigolium -Dir "$testBucket/bucket" -ForceUpdate -Version '0.5.1' -ThrowError
          $after = Get-Content "$testBucket/bucket/vigolium.json" -Raw | ConvertFrom-Json
          if ($after.version -ne '0.5.1') { throw 'Autoupdate version mismatch' }
          if ($after.architecture.'64bit'.url -ne $before.architecture.'64bit'.url) { throw 'Autoupdate URL mismatch' }
          if ($after.architecture.'64bit'.hash -ne $before.architecture.'64bit'.hash) { throw 'Autoupdate checksum mismatch' }
          git -C $testBucket init --initial-branch=main
          git -C $testBucket add bucket/vigolium.json
          git -C $testBucket -c user.name=Test -c user.email=test@example.com commit -m 'Test candidate'
          if ($LASTEXITCODE -ne 0) { throw 'Test bucket creation failed' }
          & $scoop bucket add vigolium (([Uri]$testBucket).AbsoluteUri)
          if ($LASTEXITCODE -ne 0) { throw 'Bucket registration failed' }
          & $scoop install vigolium/vigolium
          if ($LASTEXITCODE -ne 0) { throw 'Scoop install failed' }
          $binary = "$env:USERPROFILE/scoop/apps/vigolium/current/vigolium.exe"
          $versionOutput = & $binary version
          if ($LASTEXITCODE -ne 0) { throw 'Version command failed' }
          if (($versionOutput -join "`n") -notmatch '0\.5\.1') { throw 'Installed version mismatch' }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'Help command failed' }
          $marker = Get-Content "$env:USERPROFILE/scoop/apps/vigolium/current/.vigolium-package-manager" -Raw
          if ($marker.Trim() -ne 'scoop') { throw 'Ownership marker missing' }
          & $scoop uninstall vigolium
          if ($LASTEXITCODE -ne 0 -or (Test-Path $binary)) { throw 'Uninstall failed' }
